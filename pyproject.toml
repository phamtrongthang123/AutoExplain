[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoexplain-ai"
version = "0.2.0"
description = "Capability-aware explanations and activation steering for PyTorch models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Trong-Thang Pham"}]
dependencies = ["torch>=2.1", "numpy>=1.24,<3"]

[project.optional-dependencies]
playground = ["streamlit>=1.35", "matplotlib>=3.7"]
docs = ["mkdocs-material>=9.5"]
dev = ["pytest>=8", "build>=1"]
notebooks = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.7", "scikit-learn>=1.3", "psutil>=5.9"]
tabular = ["scikit-learn>=1.3", "shap>=0.46,<0.53"]
attribution = ["captum>=0.8,<0.10"]
vision = ["grad-cam>=1.5,<1.6", "torchvision>=0.16"]
diffusion = ["diffusers>=0.35,<0.41", "transformers>=5.9,<6"]
sae = ["sae-lens>=6.53,<7", "transformers>=5.9,<6"]
jlens = ["jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e", "transformers>=5.9,<6"]
openai = ["circuit-sparsity @ git+https://github.com/openai/circuit_sparsity.git@dbf1fe0d27b76c19e10d2a715f28c2e5da535e08"]
goodfire-local = ["torch>=2.4", "wandb>=0.19", "matplotlib>=3.7", "pillow>=10", "typing-extensions>=4.10"]
goodfire-remote = ["goodfire==0.3.5"]
# Incompatible with jlens/sae extras: install tracing in a separate environment.
tracing = ["circuit-tracer @ git+https://github.com/decoderesearch/circuit-tracer.git@7f66876689f59e92fc3641650d38b8bd41749ec4", "transformer-lens==2.16.1", "transformers>=4.56,<=4.57.3", "huggingface-hub<1"]

[project.urls]
Repository = "https://github.com/phamtrongthang123/AutoExplain"
Documentation = "https://phamtrongthang123.github.io/AutoExplain/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autoexplain._vendor" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
