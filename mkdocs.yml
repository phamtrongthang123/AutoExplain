site_name: AutoExplain
site_description: Explain and intervene on model internals, with runnable experiments
site_url: https://phamtrongthang123.github.io/AutoExplain/
repo_url: https://github.com/phamtrongthang123/AutoExplain
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  features:
    - navigation.tabs
    - content.code.copy
nav:
  - Start here: index.md
  - Local studio: playground.md
  - Studio UX reference: studio-ux.md
  - Methods and controls: methods.md
  - Multimodal contributions: multimodal-contributions.md
  - MM-SHAP and InterSHAP: feature-shap.md
  - CLIP and multimodal concepts: multimodal-concepts.md
  - Multimodal evaluation and tracing: multimodal-protocols.md
  - Tool integrations: integrations.md
  - Codex research planner: research.md
  - CPU notebooks: notebooks.md
  - Pretrained Gemma 4: pretrained.md
  - Natural Language Autoencoders: nla.md
  - Validation: validation.md
  - Your model: models.md
  - Diffusion and PolypSteer: diffusion.md
  - API and limitations: api.md
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
